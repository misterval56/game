<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Bazar à jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e24;--tx:#eef0ff;--mut:#9aa3d6;--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.055);--ac:#4de1ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:400 17px/1.55 Outfit,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 60vmax at 85% -10%,#3a2a8f77,transparent 60%),radial-gradient(50vmax 50vmax at -10% 110%,#0f6a8a66,transparent 60%),radial-gradient(35vmax 35vmax at 60% 70%,#8a2a5a2e,transparent 60%)}
h1,h2,h3,.logo{font-family:Unbounded,system-ui,sans-serif;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:12px}
header{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto;padding:22px 20px}
.logo{font-weight:800;font-size:18px}
#snd{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:15px}
main{max-width:980px;margin:0 auto;padding:0 20px 64px}
h1{font-weight:800;font-size:clamp(40px,9vw,92px);line-height:1.02;letter-spacing:-.03em;margin:28px 0 18px;background:linear-gradient(100deg,#4de1ff,#9b7bff 40%,#ff5d73 70%,#ffc857);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 9s ease-in-out infinite alternate}
@keyframes sh{to{background-position:100% 0}}
.lead{max-width:46ch;color:var(--mut);font-size:19px;margin:0 0 44px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.card{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:4px 20px;align-items:center;padding:24px;background:var(--glass);border:1px solid var(--line);border-radius:24px;transition:transform .25s,border-color .25s;backdrop-filter:blur(8px)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px at var(--mx,50%) var(--my,0),color-mix(in srgb,var(--ac) 32%,transparent),transparent);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:var(--ac)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.ico{grid-row:span 3;display:grid;place-items:center;width:76px;height:76px;border-radius:22px;font-size:38px;background:color-mix(in srgb,var(--ac) 22%,transparent);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent)}
.card h3{font-size:22px}
.card p{margin:0;color:var(--mut);font-size:16px}
.best{justify-self:start;margin-top:6px;font-size:14px;font-weight:600;color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin:8px 0 26px}
.back{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-weight:600}
.back:hover{border-color:var(--ac)}
#vt{font-size:clamp(24px,5vw,36px);color:var(--ac);flex:1}
#stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-width:84px;padding:8px 14px;background:var(--glass);border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--mut);line-height:1.25}
.chip b{display:block;font:600 20px Unbounded,sans-serif;color:var(--tx)}
#stage{max-width:480px;margin:0 auto;padding:20px;background:var(--glass);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(10px);box-shadow:0 30px 80px -30px color-mix(in srgb,var(--ac) 45%,transparent)}
.row{display:flex;justify-content:center;margin-top:18px}
.btn{background:var(--ac);color:#0a0e24;border:0;border-radius:99px;padding:11px 28px;font-weight:600;transition:transform .15s}
.btn:hover{transform:scale(1.05)}
.msg{min-height:28px;margin:0 0 14px;text-align:center;font-weight:600}
.hint{text-align:center;color:var(--mut);font-size:14px;margin:14px 0 0}
.seg{display:flex;gap:4px;padding:4px;margin:0 auto 16px;width:max-content;background:rgba(0,0,0,.25);border-radius:99px}
.seg button{background:none;border:0;border-radius:99px;padding:6px 18px;color:var(--mut);font-weight:600}
.seg button[aria-pressed=true]{background:var(--ac);color:#0a0e24}
.board{display:grid;gap:10px;touch-action:none}
.ttt{grid-template-columns:repeat(3,1fr)}
.ttt button{aspect-ratio:1;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:18px;font:800 clamp(34px,11vw,56px) Unbounded,sans-serif;transition:background .2s}
.ttt button:hover:empty{background:rgba(255,255,255,.1)}
.ttt .x{color:#ff5d73}.ttt .o{color:#4de1ff}
.ttt .win{background:rgba(255,200,87,.22);box-shadow:0 0 28px #ffc85755}
.mem{grid-template-columns:repeat(4,1fr)}
.mc{aspect-ratio:1;padding:0;background:none;border:0;perspective:600px}
.in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.up .in{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;border:1px solid var(--line)}
.fr{background:repeating-linear-gradient(45deg,rgba(255,200,87,.2) 0 6px,rgba(255,200,87,.07) 6px 12px)}
.bk{transform:rotateY(180deg);background:#1a2150;font-size:clamp(26px,8vw,40px)}
canvas#cv{display:block;width:100%;aspect-ratio:1;border-radius:16px;touch-action:none}
.b2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}
.t{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:rgba(0,0,0,.25);font:800 1.9rem Unbounded,sans-serif;color:#0a0e24}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <a class="logo" href="#">Le Bazar</a>
  <button id="snd" aria-pressed="true">Son : oui</button>
</header>
<main>
  <section id="home">
    <h1>Le Bazar à jeux</h1>
    <p class="lead">Quatre classiques refaits à la main. Tes records restent sur cet appareil.</p>
    <div class="cards" id="cards"></div>
  </section>
  <section id="view" hidden>
    <div class="bar">
      <a class="back" href="#">← Menu</a>
      <h2 id="vt"></h2>
      <div id="stats"></div>
    </div>
    <div id="stage"></div>
  </section>
</main>
<canvas id="fx"></canvas>

<script>
const $=s=>document.querySelector(s);
const S={get(k,d){try{const v=localStorage.getItem('bz-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bz-'+k,JSON.stringify(v))}catch(e){}}};

/* Son */
let AC,snd=S.get('snd',true);
function beep(f=440,d=.08,type='sine',v=.05){if(!snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function sndUI(){const b=$('#snd');b.textContent='Son : '+(snd?'oui':'non');b.setAttribute('aria-pressed',snd)}
$('#snd').onclick=()=>{snd=!snd;S.set('snd',snd);sndUI();beep(600)};sndUI();

/* Confettis */
const fx=$('#fx'),fc=fx.getContext('2d');let ps=[];
function confetti(){fx.width=innerWidth;fx.height=innerHeight;const run=ps.length>0;for(let i=0;i<130;i++)ps.push({x:fx.width/2,y:fx.height*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*15-3,c:['#ff5d73','#ffc857','#4de1ff','#9b7bff'][i%4],r:Math.random()*7+4,l:100});if(!run)loop()}
function loop(){fc.clearRect(0,0,fx.width,fx.height);ps=ps.filter(p=>p.l-->0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;fc.globalAlpha=Math.min(1,p.l/30);fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.r,p.r*.6)});if(ps.length)requestAnimationFrame(loop);else fc.clearRect(0,0,fx.width,fx.height)}

/* Gestes (glisser) */
function swipe(el,fn){let sx,sy;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;fn(Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1])},{passive:true})}

/* ---------- Morpion ---------- */
const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function wn(b){for(const l of WL)if(b[l[0]]&&b[l[0]]==b[l[1]]&&b[l[0]]==b[l[2]])return{p:b[l[0]],l};return b.includes('')?null:{p:'=',l:[]}}
function mm(b,p){const r=wn(b);if(r)return r.p=='O'?1:r.p=='X'?-1:0;let best=p=='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p=='O'?'X':'O');b[i]='';best=p=='O'?Math.max(best,s):Math.min(best,s)}return best}
function ai(b,mode){const f=[...b.keys()].filter(i=>!b[i]);if(mode=='easy'&&Math.random()<.6)return f[Math.random()*f.length|0];let bs=-2,mv=[];for(const i of f){b[i]='O';const s=mm(b,'X');b[i]='';if(s>bs){bs=s;mv=[i]}else if(s==bs)mv.push(i)}return mv[Math.random()*mv.length|0]}
function ttt(el,api){
  let B,over,mode=S.get('ttt-mode','hard'),sc=S.get('ttt-sc',{w:0,d:0,l:0});
  el.innerHTML='<div class="seg"><button data-m="easy">Facile</button><button data-m="hard">Imbattable</button></div><p class="msg" id="m" aria-live="polite"></p><div class="board ttt" id="b"></div><div class="row"><button class="btn" id="re">Rejouer</button></div>';
  const b=el.querySelector('#b'),m=el.querySelector('#m'),sg=el.querySelectorAll('.seg button');
  const stats=()=>api.stats([['Victoires',sc.w],['Nuls',sc.d],['Défaites',sc.l]]);
  function draw(r){b.innerHTML='';B.forEach((v,i)=>{const c=document.createElement('button');c.textContent=v;c.className=v.toLowerCase()+(r&&r.l.includes(i)?' win':'');c.setAttribute('aria-label','Case '+(i+1)+(v?', '+v:''));c.onclick=()=>play(i);b.append(c)})}
  function fin(){const r=wn(B);if(!r)return 0;over=1;if(r.p=='X'){sc.w++;m.textContent='Bien joué, tu as gagné !';confetti();beep(880,.3,'triangle')}else if(r.p=='O'){sc.l++;m.textContent="L'ordi gagne cette manche.";beep(180,.3,'sawtooth')}else{sc.d++;m.textContent='Égalité.'}S.set('ttt-sc',sc);stats();draw(r);return 1}
  function play(i){if(over||B[i])return;B[i]='X';beep(520,.06);if(!fin()){B[ai(B,mode)]='O';beep(380,.06);if(!fin())draw()}}
  function reset(){B=Array(9).fill('');over=0;m.textContent='À toi, tu joues les X.';sg.forEach(s=>s.setAttribute('aria-pressed',s.dataset.m==mode));draw();stats()}
  sg.forEach(s=>s.onclick=()=>{mode=s.dataset.m;S.set('ttt-mode',mode);reset()});
  el.querySelector('#re').onclick=reset;reset();
}

/* ---------- Memory ---------- */
function mem(el,api){
  const E=['🐙','🍕','🚀','🎸','🦊','🌵','🍩','👾'];let first,lock,mv,fd,t,tm,best=S.get('mem-best',null);
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  el.innerHTML='<div class="board mem" id="b"></div><div class="row"><button class="btn" id="re">Rejouer</button></div>';
  const b=el.querySelector('#b'),st=()=>api.stats([['Coups',mv],['Temps',fmt(t)],['Record',best?fmt(best):'–']]);
  function init(){clearInterval(tm);tm=null;first=null;lock=0;mv=0;fd=0;t=0;b.innerHTML='';[...E,...E].sort(()=>Math.random()-.5).forEach(v=>{const c=document.createElement('button');c.className='mc';c.setAttribute('aria-label','Carte');c.innerHTML='<span class="in"><span class="fr"></span><span class="bk">'+v+'</span></span>';c.onclick=()=>flip(c,v);b.append(c)});st()}
  function flip(c,v){if(lock||c.classList.contains('up'))return;if(!tm)tm=setInterval(()=>{t++;st()},1000);c.classList.add('up');beep(520,.06);if(!first){first=[c,v];return}mv++;const[a,av]=first;first=null;
    if(av==v){fd++;beep(780,.12,'triangle');if(fd==8){clearInterval(tm);if(!best||t<best){best=t;S.set('mem-best',t)}confetti();beep(988,.3,'triangle')}}
    else{lock=1;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');lock=0},750)}st()}
  el.querySelector('#re').onclick=init;init();
  return()=>clearInterval(tm);
}

/* ---------- Snake ---------- */
function snake(el,api){
  const N=20,Z=22,W=N*Z;let sn,dir={x:1,y:0},nd=dir,food,sc=0,best=S.get('snake-best',0),st='idle',to;
  el.innerHTML='<canvas id="cv" width="'+W+'" height="'+W+'"></canvas><div class="row"><button class="btn" id="re">Jouer</button></div><p class="hint">Flèches, ZQSD ou glisse le doigt sur la grille.</p>';
  const x=el.querySelector('#cv').getContext('2d'),stats=()=>api.stats([['Score',sc],['Record',best]]);
  function put(){do food={x:Math.random()*N|0,y:Math.random()*N|0};while(sn.some(p=>p.x==food.x&&p.y==food.y))}
  function draw(msg){
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){x.fillStyle=(i+j)%2?'#0f1637':'#121a43';x.fillRect(i*Z,j*Z,Z,Z)}
    x.shadowBlur=14;x.shadowColor='#ff5d73';x.fillStyle='#ff5d73';x.beginPath();x.arc(food.x*Z+Z/2,food.y*Z+Z/2,Z/2-4,0,7);x.fill();x.shadowBlur=0;
    sn.forEach((p,i)=>{x.fillStyle='hsl('+(190+i*4)%360+' 90% '+(64-Math.min(i,20)*.8)+'%)';x.beginPath();x.roundRect(p.x*Z+1,p.y*Z+1,Z-2,Z-2,i?6:10);x.fill()});
    if(msg){x.fillStyle='rgba(10,14,36,.75)';x.fillRect(0,0,W,W);x.fillStyle='#eef0ff';x.textAlign='center';x.font='600 22px Outfit,sans-serif';x.fillText(msg,W/2,W/2)}}
  function reset(){clearTimeout(to);sn=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=nd={x:1,y:0};sc=0;st='idle';put();stats();draw('Appuie sur une direction')}
  function tick(){dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(p=>p.x==h.x&&p.y==h.y)){st='over';if(sc>best){best=sc;S.set('snake-best',best)}stats();beep(150,.4,'sawtooth');draw('Perdu · '+sc+' pts');return}
    sn.unshift(h);if(h.x==food.x&&h.y==food.y){sc++;put();beep(700+sc*15,.07,'triangle');stats()}else sn.pop();
    draw();to=setTimeout(tick,Math.max(65,135-sc*3))}
  function turn(dx,dy){if(st=='over'||(dx==-dir.x&&dy==-dir.y))return;nd={x:dx,y:dy};if(st=='idle'){st='run';tick()}}
  const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]};
  const kd=e=>{const k=K[e.key];if(k){e.preventDefault();turn(...k)}};
  addEventListener('keydown',kd);swipe(el.querySelector('#cv'),k=>turn(...k));
  el.querySelector('#re').onclick=()=>{reset();turn(1,0)};reset();
  return()=>{clearTimeout(to);removeEventListener('keydown',kd)};
}

/* ---------- 2048 ---------- */
function g2048(el,api){
  let g,sc,won,over,best=S.get('2048-best',0);
  el.innerHTML='<div class="b2048" id="b"></div><p class="msg hint" id="m" aria-live="polite">Flèches ou glisse le doigt pour fusionner les tuiles.</p><div class="row"><button class="btn" id="re">Rejouer</button></div>';
  const b=el.querySelector('#b'),m=el.querySelector('#m');
  const stuck=()=>!g.includes(0)&&!g.some((v,i)=>(i%4<3&&v==g[i+1])||(i<12&&v==g[i+4]));
  function add(){const e=[];g.forEach((v,i)=>v||e.push(i));if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
  function render(){b.innerHTML=g.map(v=>'<div class="t"'+(v?' style="background:hsl('+(200+(Math.log2(v)-1)*34)%360+' 78% 62%);font-size:'+(v>999?'1.05':v>99?'1.45':'1.9')+'rem"':'')+'>'+(v||'')+'</div>').join('');api.stats([['Score',sc],['Record',best]])}
  function line(a){const r=a.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;sc+=r[i];r.splice(i+1,1)}while(r.length<4)r.push(0);return r}
  function move(d){if(over)return;const old=g.join();
    for(let k=0;k<4;k++){const idx=[0,1,2,3].map(j=>d==0?k*4+j:d==2?k*4+3-j:d==1?j*4+k:(3-j)*4+k);const r=line(idx.map(i=>g[i]));idx.forEach((i,j)=>g[i]=r[j])}
    if(g.join()==old)return;add();beep(300+Math.min(sc,1500)/3,.05,'triangle');
    if(sc>best){best=sc;S.set('2048-best',best)}
    if(!won&&g.includes(2048)){won=1;m.textContent='2048 ! Bravo, tu peux continuer.';confetti();beep(988,.3,'triangle')}
    if(stuck()){over=1;m.textContent='Plus aucun coup possible. Score : '+sc;beep(150,.4,'sawtooth')}
    render()}
  function init(){g=Array(16).fill(0);sc=0;won=over=0;add();add();m.textContent='Flèches ou glisse le doigt pour fusionner les tuiles.';render()}
  const K={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,q:0,z:1,d:2,s:3};
  const kd=e=>{if(e.key in K){e.preventDefault();move(K[e.key])}};
  addEventListener('keydown',kd);swipe(el,([x,y])=>move(x?(x<0?0:2):(y<0?1:3)));
  el.querySelector('#re').onclick=init;init();
  return()=>removeEventListener('keydown',kd);
}

/* ---------- Menu & navigation ---------- */
const GAMES=[
 {id:'morpion',t:'Morpion',e:'⭕',c:'#ff5d73',d:"Une IA en face. Facile à battre, ou imbattable.",f:ttt,best:()=>S.get('ttt-sc',{w:0}).w+' victoires'},
 {id:'memory',t:'Memory',e:'🧠',c:'#ffc857',d:'Retrouve les huit paires le plus vite possible.',f:mem,best:()=>{const v=S.get('mem-best',null);return v?'Record '+Math.floor(v/60)+':'+String(v%60).padStart(2,'0'):'Pas encore de record'}},
 {id:'snake',t:'Snake',e:'🐍',c:'#4de1ff',d:'Mange, grandis, accélère. Ne te mords pas la queue.',f:snake,best:()=>'Record '+S.get('snake-best',0)},
 {id:'2048',t:'2048',e:'🔢',c:'#9b7bff',d:'Fusionne les tuiles jusqu’à atteindre 2048.',f:g2048,best:()=>'Record '+S.get('2048-best',0)}
];
let clean=null;
function route(){
  const g=GAMES.find(x=>x.id==location.hash.slice(1));
  if(clean)clean();clean=null;$('#home').hidden=!!g;$('#view').hidden=!g;
  if(!g){document.title='Le Bazar à jeux';$('#cards').innerHTML=GAMES.map(g=>'<a class="card" href="#'+g.id+'" style="--ac:'+g.c+'"><span class="ico">'+g.e+'</span><h3>'+g.t+'</h3><p>'+g.d+'</p><span class="best">'+g.best()+'</span></a>').join('');return}
  document.title=g.t+' · Le Bazar';$('#vt').textContent=g.t;$('#view').style.setProperty('--ac',g.c);
  const st=$('#stage');st.innerHTML='';
  clean=g.f(st,{stats:a=>{$('#stats').innerHTML=a.map(([k,v])=>'<div class="chip"><b>'+v+'</b>'+k+'</div>').join('')}})||null;scrollTo(0,0);
}
addEventListener('hashchange',route);
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
route();
</script>
</body>
</html>
