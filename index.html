<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Bazar à jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e24;--tx:#eef0ff;--mut:#9aa3d6;--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.055);--ac:#4de1ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:400 17px/1.55 Outfit,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 60vmax at 85% -10%,#3a2a8f77,transparent 60%),radial-gradient(50vmax 50vmax at -10% 110%,#0f6a8a66,transparent 60%),radial-gradient(35vmax 35vmax at 60% 70%,#8a2a5a2e,transparent 60%)}
h1,h2,h3,.logo{font-family:Unbounded,system-ui,sans-serif;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:12px}
header{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto;padding:22px 20px}
.logo{font-weight:800;font-size:18px}
#snd,#mus{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:15px}
main{max-width:980px;margin:0 auto;padding:0 20px 64px}
h1{font-weight:800;font-size:clamp(40px,9vw,92px);line-height:1.02;letter-spacing:-.03em;margin:28px 0 18px;background:linear-gradient(100deg,#4de1ff,#9b7bff 40%,#ff5d73 70%,#ffc857);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 9s ease-in-out infinite alternate}
@keyframes sh{to{background-position:100% 0}}
.lead{max-width:46ch;color:var(--mut);font-size:19px;margin:0 0 44px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.card{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:4px 20px;align-items:center;padding:24px;background:var(--glass);border:1px solid var(--line);border-radius:24px;transition:transform .25s,border-color .25s;backdrop-filter:blur(8px)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px at var(--mx,50%) var(--my,0),color-mix(in srgb,var(--ac) 32%,transparent),transparent);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:var(--ac)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.ico{grid-row:span 3;display:grid;place-items:center;width:76px;height:76px;border-radius:22px;font-size:38px;background:color-mix(in srgb,var(--ac) 22%,transparent);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent)}
.card h3{font-size:22px}
.card p{margin:0;color:var(--mut);font-size:16px}
.best{justify-self:start;margin-top:6px;font-size:14px;font-weight:600;color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin:8px 0 26px}
.back{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-weight:600}
.back:hover{border-color:var(--ac)}
#vt{font-size:clamp(24px,5vw,36px);color:var(--ac);flex:1}
#stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-width:84px;padding:8px 14px;background:var(--glass);border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--mut);line-height:1.25}
.chip b{display:block;font:600 20px Unbounded,sans-serif;color:var(--tx)}
#stage{max-width:480px;margin:0 auto;padding:20px;background:var(--glass);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(10px);box-shadow:0 30px 80px -30px color-mix(in srgb,var(--ac) 45%,transparent)}
.row{display:flex;justify-content:center;margin-top:18px}
.btn{background:var(--ac);color:#0a0e24;border:0;border-radius:99px;padding:11px 28px;font-weight:600;transition:transform .15s}
.btn:hover{transform:scale(1.05)}
.msg{min-height:28px;margin:0 0 14px;text-align:center;font-weight:600}
.hint{text-align:center;color:var(--mut);font-size:14px;margin:14px 0 0}
.seg{display:flex;gap:4px;padding:4px;margin:0 auto 16px;width:max-content;background:rgba(0,0,0,.25);border-radius:99px}
.seg button{background:none;border:0;border-radius:99px;padding:6px 18px;color:var(--mut);font-weight:600}
.seg button[aria-pressed=true]{background:var(--ac);color:#0a0e24}
.board{display:grid;gap:10px;touch-action:none}
.ttt{grid-template-columns:repeat(3,1fr)}
.ttt button{aspect-ratio:1;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:18px;font:800 clamp(34px,11vw,56px) Unbounded,sans-serif;transition:background .2s}
.ttt button:hover:empty{background:rgba(255,255,255,.1)}
.ttt .x{color:#ff5d73}.ttt .o{color:#4de1ff}
.ttt .win{background:rgba(255,200,87,.22);box-shadow:0 0 28px #ffc85755}
.mem{grid-template-columns:repeat(4,1fr)}
.mc{aspect-ratio:1;padding:0;background:none;border:0;perspective:600px}
.in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.up .in{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;border:1px solid var(--line)}
.fr{background:repeating-linear-gradient(45deg,rgba(255,200,87,.2) 0 6px,rgba(255,200,87,.07) 6px 12px)}
.bk{transform:rotateY(180deg);background:#1a2150;font-size:clamp(26px,8vw,40px)}
canvas#cv{display:block;width:100%;aspect-ratio:1;border-radius:16px;touch-action:none}
.b2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}
.t{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:rgba(0,0,0,.25);font:800 1.9rem Unbounded,sans-serif;color:#0a0e24}
.p4{grid-template-columns:repeat(7,1fr);gap:6px;background:#2a3a9a;padding:8px;border-radius:16px}
.p4 button{aspect-ratio:1;border-radius:50%;border:0;background:#0a0e24;padding:0}
.p4 .R{background:#ff5d73}.p4 .Y{background:#ffc857}
.moles{grid-template-columns:repeat(3,1fr)}
.moles button{aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(#3a2a1a 55%,#1a1210);font-size:clamp(34px,11vw,56px);padding:0}
.simon{grid-template-columns:1fr 1fr}
.simon button{aspect-ratio:1;border:0;border-radius:24px;background:color-mix(in srgb,var(--c) 42%,#0a0e24);transition:background .1s,box-shadow .1s}
.simon .on{background:var(--c);box-shadow:0 0 40px var(--c)}
#mus{margin-left:8px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <a class="logo" href="#">Le Bazar</a>
  <span><button id="snd" aria-pressed="true">Son : oui</button><button id="mus" aria-pressed="false">Musique : non</button></span>
</header>
<main>
  <section id="home">
    <h1>Le Bazar à jeux</h1>
    <p class="lead">Treize jeux refaits à la main, de Pac-Man à Cube Dash. Tes records restent sur cet appareil.</p>
    <div class="cards" id="cards"></div>
  </section>
  <section id="view" hidden>
    <div class="bar">
      <a class="back" href="#">← Menu</a>
      <h2 id="vt"></h2>
      <div id="stats"></div>
    </div>
    <div id="stage"></div>
  </section>
</main>
<canvas id="fx"></canvas>

<script>
const $=s=>document.querySelector(s);
const S={get(k,d){try{const v=localStorage.getItem('bz-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bz-'+k,JSON.stringify(v))}catch(e){}}};

/* Son */
let AC,snd=S.get('snd',true);
function beep(f=440,d=.08,type='sine',v=.05){if(!snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;if(AC.state=='suspended')AC.resume();o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f*(type=='sawtooth'?.5:type=='triangle'?1.3:1),AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function sndUI(){const b=$('#snd');b.textContent='Son : '+(snd?'oui':'non');b.setAttribute('aria-pressed',snd)}
$('#snd').onclick=()=>{snd=!snd;S.set('snd',snd);sndUI();beep(600)};sndUI();
let music=S.get('mus',false),mi=0,mt;
const PAT=[0,3,7,10,12,10,7,3,0,5,8,12,15,12,8,5];
function musUI(){const b=$('#mus');b.textContent='Musique : '+(music?'oui':'non');b.setAttribute('aria-pressed',music)}
function musLoop(){clearInterval(mt);if(music)mt=setInterval(()=>{if(snd)beep(196*2**(PAT[mi++%16]/12),.2,'triangle',.014)},240)}
$('#mus').onclick=()=>{music=!music;S.set('mus',music);musUI();musLoop()};musUI();musLoop();

/* Confettis */
const fx=$('#fx'),fc=fx.getContext('2d');let ps=[];
function confetti(){fx.width=innerWidth;fx.height=innerHeight;const run=ps.length>0;for(let i=0;i<130;i++)ps.push({x:fx.width/2,y:fx.height*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*15-3,c:['#ff5d73','#ffc857','#4de1ff','#9b7bff'][i%4],r:Math.random()*7+4,l:100});if(!run)loop()}
function loop(){fc.clearRect(0,0,fx.width,fx.height);ps=ps.filter(p=>p.l-->0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;fc.globalAlpha=Math.min(1,p.l/30);fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.r,p.r*.6)});if(ps.length)requestAnimationFrame(loop);else fc.clearRect(0,0,fx.width,fx.height)}

/* Gestes (glisser) */
function swipe(el,fn){let sx,sy;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;fn(Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1])},{passive:true})}

/* ---------- Morpion ---------- */
const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function wn(b){for(const l of WL)if(b[l[0]]&&b[l[0]]==b[l[1]]&&b[l[0]]==b[l[2]])return{p:b[l[0]],l};return b.includes('')?null:{p:'=',l:[]}}
function mm(b,p){const r=wn(b);if(r)return r.p=='O'?1:r.p=='X'?-1:0;let best=p=='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p=='O'?'X':'O');b[i]='';best=p=='O'?Math.max(best,s):Math.min(best,s)}return best}
function ai(b,mode){const f=[...b.keys()].filter(i=>!b[i]);if(mode=='easy'&&Math.random()<.6)return f[Math.random()*f.length|0];let bs=-2,mv=[];for(const i of f){b[i]='O';const s=mm(b,'X');b[i]='';if(s>bs){bs=s;mv=[i]}else if(s==bs)mv.push(i)}return mv[Math.random()*mv.length|0]}
function ttt(el,api){
  let B,over,mode=S.get('ttt-mode','hard'),sc=S.get('ttt-sc',{w:0,d:0,l:0});
  el.innerHTML='<div class="seg"><button data-m="easy">Facile</button><button data-m="hard">Imbattable</button></div><p class="msg" id="m" aria-live="polite"></p><div class="board ttt" id="b"></div><div class="row"><button class="btn" id="re">Rejouer</button></div>';
  const b=el.querySelector('#b'),m=el.querySelector('#m'),sg=el.querySelectorAll('.seg button');
  const stats=()=>api.stats([['Victoires',sc.w],['Nuls',sc.d],['Défaites',sc.l]]);
  function draw(r){b.innerHTML='';B.forEach((v,i)=>{const c=document.createElement('button');c.textContent=v;c.className=v.toLowerCase()+(r&&r.l.includes(i)?' win':'');c.setAttribute('aria-label','Case '+(i+1)+(v?', '+v:''));c.onclick=()=>play(i);b.append(c)})}
  function fin(){const r=wn(B);if(!r)return 0;over=1;if(r.p=='X'){sc.w++;m.textContent='Bien joué, tu as gagné !';confetti();beep(880,.3,'triangle')}else if(r.p=='O'){sc.l++;m.textContent="L'ordi gagne cette manche.";beep(180,.3,'sawtooth')}else{sc.d++;m.textContent='Égalité.'}S.set('ttt-sc',sc);stats();draw(r);return 1}
  function play(i){if(over||B[i])return;B[i]='X';beep(520,.06);if(!fin()){B[ai(B,mode)]='O';beep(380,.06);if(!fin())draw()}}
  function reset(){B=Array(9).fill('');over=0;m.textContent='À toi, tu joues les X.';sg.forEach(s=>s.setAttribute('aria-pressed',s.dataset.m==mode));draw();stats()}
  sg.forEach(s=>s.onclick=()=>{mode=s.dataset.m;S.set('ttt-mode',mode);reset()});
  el.querySelector('#re').onclick=reset;reset();
}

/* ---------- Memory ---------- */
function mem(el,api){
  const E=['🐙','🍕','🚀','🎸','🦊','🌵','🍩','👾'];let first,lock,mv,fd,t,tm,best=S.get('mem-best',null);
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  el.innerHTML='<div class="board mem" id="b"></div><div class="row"><button class="btn" id="re">Rejouer</button></div>';
  const b=el.querySelector('#b'),st=()=>api.stats([['Coups',mv],['Temps',fmt(t)],['Record',best?fmt(best):'–']]);
  function init(){clearInterval(tm);tm=null;first=null;lock=0;mv=0;fd=0;t=0;b.innerHTML='';[...E,...E].sort(()=>Math.random()-.5).forEach(v=>{const c=document.createElement('button');c.className='mc';c.setAttribute('aria-label','Carte');c.innerHTML='<span class="in"><span class="fr"></span><span class="bk">'+v+'</span></span>';c.onclick=()=>flip(c,v);b.append(c)});st()}
  function flip(c,v){if(lock||c.classList.contains('up'))return;if(!tm)tm=setInterval(()=>{t++;st()},1000);c.classList.add('up');beep(520,.06);if(!first){first=[c,v];return}mv++;const[a,av]=first;first=null;
    if(av==v){fd++;beep(780,.12,'triangle');if(fd==8){clearInterval(tm);if(!best||t<best){best=t;S.set('mem-best',t)}confetti();beep(988,.3,'triangle')}}
    else{lock=1;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');lock=0},750)}st()}
  el.querySelector('#re').onclick=init;init();
  return()=>clearInterval(tm);
}

/* ---------- Snake ---------- */
function snake(el,api){
  const N=20,Z=22,W=N*Z;let sn,dir={x:1,y:0},nd=dir,food,sc=0,best=S.get('snake-best',0),st='idle',to;
  el.innerHTML='<canvas id="cv" width="'+W+'" height="'+W+'"></canvas><div class="row"><button class="btn" id="re">Jouer</button></div><p class="hint">Flèches, ZQSD ou glisse le doigt sur la grille.</p>';
  const x=el.querySelector('#cv').getContext('2d'),stats=()=>api.stats([['Score',sc],['Record',best]]);
  function put(){do food={x:Math.random()*N|0,y:Math.random()*N|0};while(sn.some(p=>p.x==food.x&&p.y==food.y))}
  function draw(msg){
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){x.fillStyle=(i+j)%2?'#0f1637':'#121a43';x.fillRect(i*Z,j*Z,Z,Z)}
    x.shadowBlur=14;x.shadowColor='#ff5d73';x.fillStyle='#ff5d73';x.beginPath();x.arc(food.x*Z+Z/2,food.y*Z+Z/2,Z/2-4,0,7);x.fill();x.shadowBlur=0;
    sn.forEach((p,i)=>{x.fillStyle='hsl('+(190+i*4)%360+' 90% '+(64-Math.min(i,20)*.8)+'%)';x.beginPath();x.roundRect(p.x*Z+1,p.y*Z+1,Z-2,Z-2,i?6:10);x.fill()});
    if(msg){x.fillStyle='rgba(10,14,36,.75)';x.fillRect(0,0,W,W);x.fillStyle='#eef0ff';x.textAlign='center';x.font='600 22px Outfit,sans-serif';x.fillText(msg,W/2,W/2)}}
  function reset(){clearTimeout(to);sn=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=nd={x:1,y:0};sc=0;st='idle';put();stats();draw('Appuie sur une direction')}
  function tick(){dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(p=>p.x==h.x&&p.y==h.y)){st='over';if(sc>best){best=sc;S.set('snake-best',best)}stats();beep(150,.4,'sawtooth');draw('Perdu · '+sc+' pts');return}
    sn.unshift(h);if(h.x==food.x&&h.y==food.y){sc++;put();beep(700+sc*15,.07,'triangle');stats()}else sn.pop();
    draw();to=setTimeout(tick,Math.max(65,135-sc*3))}
  function turn(dx,dy){if(st=='over'||(dx==-dir.x&&dy==-dir.y))return;nd={x:dx,y:dy};if(st=='idle'){st='run';tick()}}
  const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]};
  const kd=e=>{const k=K[e.key];if(k){e.preventDefault();turn(...k)}};
  addEventListener('keydown',kd);swipe(el.querySelector('#cv'),k=>turn(...k));
  el.querySelector('#re').onclick=()=>{reset();turn(1,0)};reset();
  return()=>{clearTimeout(to);removeEventListener('keydown',kd)};
}

/* ---------- 2048 ---------- */
function g2048(el,api){
  let g,sc,won,over,best=S.get('2048-best',0);
  el.innerHTML='<div class="b2048" id="b"></div><p class="msg hint" id="m" aria-live="polite">Flèches ou glisse le doigt pour fusionner les tuiles.</p><div class="row"><button class="btn" id="re">Rejouer</button></div>';
  const b=el.querySelector('#b'),m=el.querySelector('#m');
  const stuck=()=>!g.includes(0)&&!g.some((v,i)=>(i%4<3&&v==g[i+1])||(i<12&&v==g[i+4]));
  function add(){const e=[];g.forEach((v,i)=>v||e.push(i));if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
  function render(){b.innerHTML=g.map(v=>'<div class="t"'+(v?' style="background:hsl('+(200+(Math.log2(v)-1)*34)%360+' 78% 62%);font-size:'+(v>999?'1.05':v>99?'1.45':'1.9')+'rem"':'')+'>'+(v||'')+'</div>').join('');api.stats([['Score',sc],['Record',best]])}
  function line(a){const r=a.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;sc+=r[i];r.splice(i+1,1)}while(r.length<4)r.push(0);return r}
  function move(d){if(over)return;const old=g.join();
    for(let k=0;k<4;k++){const idx=[0,1,2,3].map(j=>d==0?k*4+j:d==2?k*4+3-j:d==1?j*4+k:(3-j)*4+k);const r=line(idx.map(i=>g[i]));idx.forEach((i,j)=>g[i]=r[j])}
    if(g.join()==old)return;add();beep(300+Math.min(sc,1500)/3,.05,'triangle');
    if(sc>best){best=sc;S.set('2048-best',best)}
    if(!won&&g.includes(2048)){won=1;m.textContent='2048 ! Bravo, tu peux continuer.';confetti();beep(988,.3,'triangle')}
    if(stuck()){over=1;m.textContent='Plus aucun coup possible. Score : '+sc;beep(150,.4,'sawtooth')}
    render()}
  function init(){g=Array(16).fill(0);sc=0;won=over=0;add();add();m.textContent='Flèches ou glisse le doigt pour fusionner les tuiles.';render()}
  const K={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,q:0,z:1,d:2,s:3};
  const kd=e=>{if(e.key in K){e.preventDefault();move(K[e.key])}};
  addEventListener('keydown',kd);swipe(el,([x,y])=>move(x?(x<0?0:2):(y<0?1:3)));
  el.querySelector('#re').onclick=init;init();
  return()=>removeEventListener('keydown',kd);
}

/* ---------- Outils pour les jeux canvas ---------- */
function cvs(el,w,h,hint){el.innerHTML='<canvas id="cv" width="'+w+'" height="'+h+'" style="aspect-ratio:'+w+'/'+h+'"></canvas><div class="row"><button class="btn" id="re">Jouer</button></div><p class="hint">'+hint+'</p>';const c=el.querySelector('#cv');return[c.getContext('2d'),c,el.querySelector('#re')]}
function ov(x,w,h,m){if(!m)return;x.fillStyle='rgba(10,14,36,.75)';x.fillRect(0,0,w,h);x.fillStyle='#eef0ff';x.textAlign='center';x.font='600 22px Outfit,sans-serif';x.fillText(m,w/2,h/2)}
function keys(){const k={},d=e=>{k[e.key]=1;if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault()},u=e=>k[e.key]=0;addEventListener('keydown',d);addEventListener('keyup',u);return[k,()=>{removeEventListener('keydown',d);removeEventListener('keyup',u)}]}

/* ---------- Course ---------- */
function course(el,api){
  const[x,c,re]=cvs(el,300,480,'← → ou touche la moitié gauche / droite de la route.');
  const[k,off]=keys();let car,en,sp,dist,sc,so,tm,tl=0,tr=0,best=S.get('car-best',0);
  const stats=()=>api.stats([['Score',sc],['Record',best]]);
  const veh=(px,py,col)=>{x.fillStyle=col;x.beginPath();x.roundRect(px,py,30,54,9);x.fill();x.fillStyle='rgba(255,255,255,.6)';x.fillRect(px+5,py+13,20,11);x.fillStyle='rgba(0,0,0,.25)';x.fillRect(px+5,py+36,20,8)};
  function draw(m){x.fillStyle='#0c1236';x.fillRect(0,0,300,480);x.fillStyle='#1a2150';x.fillRect(30,0,240,480);x.fillStyle='#ffc857';x.fillRect(28,0,4,480);x.fillRect(268,0,4,480);x.fillStyle='rgba(238,240,255,.7)';for(let i=-1;i<13;i++)x.fillRect(148,i*40+so,4,22);en.forEach(e=>veh(e.x,e.y,e.c));veh(car.x,400,'#ff5d73');ov(x,300,480,m)}
  function end(){clearInterval(tm);if(sc>best){best=sc;S.set('car-best',best)}stats();beep(120,.5,'sawtooth');draw('Crash · '+sc+' pts')}
  function step(){if(k.ArrowLeft||k.q||tl)car.x-=5;if(k.ArrowRight||k.d||tr)car.x+=5;car.x=Math.max(32,Math.min(238,car.x));
    sp=Math.min(11,sp+.004);dist+=sp;sc=dist/60|0;so=(so+sp)%40;
    if(!en.length||(en[en.length-1].y>170&&Math.random()<.05))en.push({x:34+Math.random()*200|0,y:-60,c:'hsl('+(Math.random()*360|0)+' 80% 60%)'});
    en.forEach(e=>e.y+=sp*.6);en=en.filter(e=>e.y<490);
    if(en.some(e=>Math.abs(e.x-car.x)<28&&Math.abs(e.y-400)<50)){end();return}
    stats();draw()}
  function reset(){clearInterval(tm);car={x:135};en=[];sp=4;dist=0;sc=0;so=0;stats();draw('Appuie sur Jouer')}
  re.onclick=()=>{reset();tm=setInterval(step,16)};
  c.onpointerdown=c.onpointermove=e=>{if(e.buttons){const r=c.getBoundingClientRect(),l=e.clientX-r.left<r.width/2;tl=l;tr=!l}};
  c.onpointerup=c.onpointerleave=()=>tl=tr=0;
  reset();return()=>{clearInterval(tm);off()};
}

/* ---------- Pac-Man ---------- */
function pac(el,api){
  const M=["###############","#o.....#.....o#","#.###.###.###.#","#.............#","#.###.#.#.###.#","#.....#.#.....#","#####.#.#.#####","#.............#","#.###.###.###.#","#o..#.....#..o#","###.#.#.#.#.###","#.....#.#.....#","#.###.....###.#","#.............#","###############"],Z=22,W=330;
  const[x,c,re]=cvs(el,W,W,'Flèches, ZQSD ou glisse le doigt. Les gros points rendent les fantômes vulnérables.');
  const S0=[[7,3,'#ff5d73'],[1,13,'#ff9bd2'],[13,13,'#4de1ff']];
  let g,P,D,ND,G,sc,lv,fr,fear,dots,tm,run,over,best=S.get('pac-best',0);
  const stats=()=>api.stats([['Score',sc],['Vies',lv],['Record',best]]);
  const place=()=>{P={x:7,y:7};D=ND={x:0,y:0};G=S0.map(([a,b,k])=>({x:a,y:b,s:[a,b],k,d:{x:0,y:0}}))};
  function draw(m){x.fillStyle='#0b1030';x.fillRect(0,0,W,W);
    for(let j=0;j<15;j++)for(let i=0;i<15;i++){const v=g[j][i];if(v=='#'){x.fillStyle='#2a3a9a';x.beginPath();x.roundRect(i*Z+2,j*Z+2,Z-4,Z-4,6);x.fill()}else if(v!=' '){x.fillStyle=v=='o'?'#ffc857':'#eef0ff';x.beginPath();x.arc(i*Z+Z/2,j*Z+Z/2,v=='o'?6:2.5,0,7);x.fill()}}
    const a=(D.x||D.y)?Math.atan2(D.y,D.x):0,m2=.15+(fr%2)*.3,px=P.x*Z+Z/2,py=P.y*Z+Z/2;
    x.fillStyle='#ffd23f';x.beginPath();x.moveTo(px,py);x.arc(px,py,Z/2-2,a+m2,a+6.28-m2);x.fill();
    G.forEach(h=>{x.fillStyle=fear?(fear<15&&fr%2?'#fff':'#4a5bff'):h.k;const gx=h.x*Z+2,gy=h.y*Z+2,s=Z-4;x.beginPath();x.arc(gx+s/2,gy+s/2,s/2,Math.PI,0);x.lineTo(gx+s,gy+s);x.lineTo(gx,gy+s);x.fill();x.fillStyle='#fff';x.fillRect(gx+4,gy+6,4,5);x.fillRect(gx+s-8,gy+6,4,5)});
    ov(x,W,W,m)}
  function end(m){clearInterval(tm);over=1;if(sc>best){best=sc;S.set('pac-best',best)}stats();draw(m)}
  function hit(){for(const h of G)if(h.x==P.x&&h.y==P.y){if(fear){h.x=h.s[0];h.y=h.s[1];sc+=200;beep(900,.1,'square',.04);stats()}else{lv--;beep(150,.4,'sawtooth');stats();if(lv<1){end('Perdu · '+sc);return 1}place();draw();return 1}}return 0}
  function tick(){fr++;
    if(g[P.y+ND.y][P.x+ND.x]!='#')D=ND;
    if(g[P.y+D.y][P.x+D.x]!='#'){P.x+=D.x;P.y+=D.y}
    const t=g[P.y][P.x];if(t=='.'||t=='o'){g[P.y][P.x]=' ';sc+=t=='o'?50:10;dots--;if(t=='o')fear=45;beep(t=='o'?300:660,.03,'square',.025);stats()}
    if(fear)fear--;if(hit())return;
    G.forEach(h=>{if(fear?fr%2:!(fr%4))return;let o=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>g[h.y+d[1]][h.x+d[0]]!='#'&&!(d[0]==-h.d.x&&d[1]==-h.d.y));if(!o.length)o=[[-h.d.x,-h.d.y]];
      const dd=d=>(h.x+d[0]-P.x)**2+(h.y+d[1]-P.y)**2,d=Math.random()<.7?o.sort((a,b)=>fear?dd(b)-dd(a):dd(a)-dd(b))[0]:o[Math.random()*o.length|0];h.d={x:d[0],y:d[1]};h.x+=d[0];h.y+=d[1]});
    if(hit())return;if(!dots){confetti();end('Gagné ! '+sc);return}draw()}
  function reset(){clearInterval(tm);g=M.map(r=>r.split(''));dots=g.flat().filter(v=>v=='.'||v=='o').length;place();sc=0;lv=3;fr=0;fear=0;run=over=0;stats();draw('Appuie sur une direction')}
  function turn(dx,dy){if(over)return;ND={x:dx,y:dy};if(!run){run=1;tm=setInterval(tick,130)}}
  const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],z:[0,-1],s:[0,1],q:[-1,0],d:[1,0]};
  const kd=e=>{const k=K[e.key];if(k){e.preventDefault();turn(...k)}};
  addEventListener('keydown',kd);swipe(c,k=>turn(...k));re.onclick=reset;reset();
  return()=>{clearInterval(tm);removeEventListener('keydown',kd)};
}

/* ---------- Casse-briques ---------- */
function brk(el,api){
  const W=360,H=480,[x,c,re]=cvs(el,W,H,'Glisse le doigt ou la souris, ou utilise ← →.'),[k,off]=keys();
  let p,b,br,sc,lv,tm,run,over,best=S.get('brk-best',0);
  const stats=()=>api.stats([['Score',sc],['Vies',lv],['Record',best]]);
  function draw(m){x.fillStyle='#0b1030';x.fillRect(0,0,W,H);br.forEach(r=>{x.fillStyle='hsl('+(r.h+10)+' 85% 62%)';x.beginPath();x.roundRect(r.x,r.y,40,16,4);x.fill()});
    x.fillStyle='#eef0ff';x.beginPath();x.roundRect(p.x,H-28,p.w,10,5);x.fill();x.fillStyle='#ffc857';x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill();ov(x,W,H,m)}
  function end(m){clearInterval(tm);over=1;run=0;if(sc>best){best=sc;S.set('brk-best',best)}stats();draw(m)}
  function step(){if(k.ArrowLeft||k.q)p.x-=7;if(k.ArrowRight||k.d)p.x+=7;p.x=Math.max(0,Math.min(W-p.w,p.x));
    b.x+=b.vx;b.y+=b.vy;if(b.x<6||b.x>W-6){b.vx*=-1;b.x=Math.max(6,Math.min(W-6,b.x))}if(b.y<6)b.vy=Math.abs(b.vy);
    if(b.vy>0&&b.y>H-34&&b.y<H-16&&b.x>p.x-4&&b.x<p.x+p.w+4){const t=(b.x-p.x)/p.w-.5,s=Math.min(8,5+sc/150);b.vx=s*t*1.5;b.vy=-Math.sqrt(Math.max(s*s-b.vx*b.vx,6));beep(420,.04)}
    const i=br.findIndex(r=>b.x>r.x-6&&b.x<r.x+46&&b.y>r.y-6&&b.y<r.y+22);
    if(i>=0){br.splice(i,1);b.vy*=-1;sc+=10;beep(700,.04,'square',.03);stats()}
    if(b.y>H){lv--;stats();if(lv<1){end('Perdu · '+sc);return}b.x=p.x+p.w/2;b.y=H-40;b.vx=3;b.vy=-4}
    if(!br.length){confetti();end('Gagné ! '+sc);return}draw()}
  function reset(){clearInterval(tm);p={x:145,w:70};b={x:180,y:420,vx:3,vy:-4};br=[];for(let r=0;r<5;r++)for(let i=0;i<8;i++)br.push({x:8+i*44,y:50+r*22,h:r*55});sc=0;lv=3;run=over=0;stats();draw('Appuie sur Jouer')}
  const go=()=>{if(!run){run=1;tm=setInterval(step,16)}};
  re.onclick=()=>{reset();go()};
  c.onpointermove=e=>{p.x=Math.max(0,Math.min(W-p.w,(e.clientX-c.getBoundingClientRect().left)/c.clientWidth*W-p.w/2))};
  c.onpointerdown=()=>{if(!over)go()};
  reset();return()=>{clearInterval(tm);off()};
}

/* ---------- Flappy ---------- */
function flappy(el,api){
  const[x,c,re]=cvs(el,320,480,'Espace, flèche haut ou touche l’écran pour sauter.');
  let y,vy,ps,f,sc,tm,run,over,best=S.get('flap-best',0);
  const stats=()=>api.stats([['Score',sc],['Record',best]]);
  function draw(m){const g=x.createLinearGradient(0,0,0,480);g.addColorStop(0,'#1b2a7a');g.addColorStop(1,'#d6567a');x.fillStyle=g;x.fillRect(0,0,320,480);
    x.fillStyle='#4de1ff';ps.forEach(p=>{x.beginPath();x.roundRect(p.x,-10,52,p.g+10,8);x.fill();x.beginPath();x.roundRect(p.x,p.g+140,52,400,8);x.fill()});
    x.fillStyle='#ffc857';x.beginPath();x.arc(80,y,13,0,7);x.fill();x.fillStyle='#0a0e24';x.beginPath();x.arc(86,y-4,3,0,7);x.fill();ov(x,320,480,m)}
  function end(){clearInterval(tm);over=1;if(sc>best){best=sc;S.set('flap-best',best)}stats();beep(150,.4,'sawtooth');draw('Perdu · '+sc)}
  function step(){f++;vy+=.42;y+=vy;if(f%85==1)ps.push({x:330,g:60+Math.random()*250|0,s:0});
    ps.forEach(p=>{p.x-=2.6;if(!p.s&&p.x+52<67){p.s=1;sc++;beep(800,.06,'triangle');stats()}});ps=ps.filter(p=>p.x>-60);
    if(y>480||y<0||ps.some(p=>91>p.x&&69<p.x+52&&(y-11<p.g||y+11>p.g+140))){end();return}draw()}
  const flap=()=>{if(over)return;if(!run){run=1;tm=setInterval(step,16)}vy=-7.2;beep(500,.04)};
  function reset(){clearInterval(tm);y=240;vy=0;ps=[];f=0;sc=0;run=over=0;stats();draw('Touche pour sauter')}
  const kd=e=>{if(e.key==' '||e.key=='ArrowUp'){e.preventDefault();flap()}};
  addEventListener('keydown',kd);c.onpointerdown=flap;re.onclick=()=>{reset();flap()};reset();
  return()=>{clearInterval(tm);removeEventListener('keydown',kd)};
}

/* ---------- Cube Dash ---------- */
function dash(el,api){
  const W=480,H=270,G=220,[x,c,re]=cvs(el,W,H,'Espace, flèche haut ou touche l’écran pour sauter.');
  let y,vy,ob,sp,d,sc,rot,tm,run,over,best=S.get('dash-best',0);
  const stats=()=>api.stats([['Score',sc],['Record',best]]);
  function draw(m){x.save();const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b1a6b');g.addColorStop(1,'#0f6a8a');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<8;i++)x.fillRect(((i*90-d*.3)%720+720)%720-120,40+(i%3)*40,60,60);
    x.fillStyle='#0a0e24';x.fillRect(0,G,W,H-G);x.fillStyle='#4de1ff';x.fillRect(0,G,W,3);
    ob.forEach(o=>{if(o.t){x.fillStyle='#ff9f43';x.fillRect(o.x,G-30,30,30)}else{x.fillStyle='#ff5d73';for(let i=0;i<o.n;i++){x.beginPath();x.moveTo(o.x+i*30,G);x.lineTo(o.x+i*30+15,G-30);x.lineTo(o.x+i*30+30,G);x.fill()}}});
    x.translate(85,y+15);x.rotate(rot);x.fillStyle='#ffd23f';x.fillRect(-15,-15,30,30);x.fillStyle='#0a0e24';x.fillRect(-8,-8,6,6);x.fillRect(4,-8,6,6);x.fillRect(-8,4,18,4);x.restore();ov(x,W,H,m)}
  function end(){clearInterval(tm);over=1;if(sc>best){best=sc;S.set('dash-best',best)}stats();beep(140,.5,'sawtooth');draw('Crash · '+sc)}
  function step(){vy+=.85;y+=vy;if(y>=G-30){y=G-30;vy=0;rot=Math.round(rot/1.5708)*1.5708}else rot+=.13;
    sp=Math.min(9,5+d/2500);d+=sp;sc=d/40|0;
    const l=ob[ob.length-1];if(!l||l.x<W-230-Math.random()*180)ob.push({x:W+10,t:Math.random()<.3?1:0,n:1+(Math.random()<.35)});
    ob.forEach(o=>o.x-=sp);ob=ob.filter(o=>o.x>-100);
    if(ob.some(o=>{const hx=o.t?o.x+2:o.x+8,hw=o.t?26:30*o.n-16,hh=o.t?28:20;return 96>hx&&74<hx+hw&&y+26>G-hh})){end();return}
    stats();draw()}
  const jump=()=>{if(over)return;if(!run){run=1;tm=setInterval(step,16)}if(y>=G-30){vy=-13.5;beep(520,.07,'square',.03)}};
  function reset(){clearInterval(tm);y=G-30;vy=0;ob=[];sp=5;d=0;sc=0;rot=0;run=over=0;stats();draw('Touche pour sauter')}
  const kd=e=>{if(e.key==' '||e.key=='ArrowUp'){e.preventDefault();jump()}};
  addEventListener('keydown',kd);c.onpointerdown=jump;re.onclick=()=>{reset();jump()};reset();
  return()=>{clearInterval(tm);removeEventListener('keydown',kd)};
}

/* ---------- Puissance 4 ---------- */
function p4(el,api){
  let B,over,wait,sc=S.get('p4-sc',{w:0,l:0,d:0});
  el.innerHTML='<p class="msg" id="m" aria-live="polite"></p><div class="board p4" id="b"></div><div class="row"><button class="btn" id="re">Rejouer</button></div>';
  const b=el.querySelector('#b'),m=el.querySelector('#m');
  const stats=()=>api.stats([['Victoires',sc.w],['Nuls',sc.d],['Défaites',sc.l]]);
  const row=c=>{for(let r=5;r>=0;r--)if(!B[r*7+c])return r;return -1};
  const win=(i,p)=>{const r=i/7|0,c=i%7;return[[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(const s of[1,-1])for(let k=1;k<4;k++){const rr=r+dr*k*s,cc=c+dc*k*s;if(rr<0||rr>5||cc<0||cc>6||B[rr*7+cc]!=p)break;n++}return n>=4})};
  function draw(){b.innerHTML='';B.forEach((v,i)=>{const e=document.createElement('button');e.className=v;e.setAttribute('aria-label','Colonne '+(i%7+1));e.onclick=()=>play(i%7);b.append(e)})}
  function done(i,p){if(win(i,p)){over=1;if(p=='R'){sc.w++;m.textContent='Tu gagnes !';confetti();beep(880,.3,'triangle')}else{sc.l++;m.textContent="L'ordi gagne.";beep(180,.3,'sawtooth')}}else if(!B.includes('')){over=1;sc.d++;m.textContent='Égalité.'}else return 0;S.set('p4-sc',sc);stats();return 1}
  function play(c){if(over||wait)return;const r=row(c);if(r<0)return;B[r*7+c]='R';beep(500,.06);draw();if(done(r*7+c,'R'))return;wait=1;
    setTimeout(()=>{wait=0;const cs=[0,1,2,3,4,5,6].filter(k=>row(k)>=0);
      const t=(p,k)=>{const q=row(k);B[q*7+k]=p;const w=win(q*7+k,p);B[q*7+k]='';return w};
      let k=cs.find(k=>t('Y',k));if(k==null)k=cs.find(k=>t('R',k));
      if(k==null){const safe=cs.filter(k=>{const q=row(k);if(!q)return 1;B[q*7+k]='Y';B[(q-1)*7+k]='R';const w=win((q-1)*7+k,'R');B[q*7+k]=B[(q-1)*7+k]='';return!w});
        k=(safe.length?safe:cs).sort((a,b)=>Math.abs(a-3)-Math.abs(b-3)+(Math.random()-.5)*2)[0]}
      const q=row(k);B[q*7+k]='Y';beep(380,.06);draw();done(q*7+k,'Y')},400)}
  function reset(){B=Array(42).fill('');over=0;wait=0;m.textContent='À toi, tu joues les rouges.';draw();stats()}
  el.querySelector('#re').onclick=reset;reset();
}

/* ---------- Taupe ---------- */
function taupe(el,api){
  let sc=0,t=30,tm,mt,cur=-1,run=0,best=S.get('mole-best',0);
  el.innerHTML='<div class="board moles" id="b"></div><div class="row"><button class="btn" id="re">Jouer</button></div><p class="hint">Tape les taupes avant qu’elles ne disparaissent. 30 secondes.</p>';
  const b=el.querySelector('#b'),stats=()=>api.stats([['Score',sc],['Temps',t],['Record',best]]),clear=()=>[...b.children].forEach(h=>h.textContent='');
  for(let i=0;i<9;i++){const h=document.createElement('button');h.setAttribute('aria-label','Trou '+(i+1));h.onclick=()=>{if(run&&i==cur){sc++;cur=-1;beep(700+sc*10,.06,'triangle');h.textContent='💥';stats()}};b.append(h)}
  function pop(){clear();cur=Math.random()*9|0;b.children[cur].textContent='🐹';mt=setTimeout(pop,Math.max(380,850-sc*14))}
  function end(){run=0;clearInterval(tm);clearTimeout(mt);clear();if(sc>best){best=sc;S.set('mole-best',best);confetti()}stats()}
  el.querySelector('#re').onclick=()=>{clearInterval(tm);clearTimeout(mt);sc=0;t=30;run=1;stats();pop();tm=setInterval(()=>{t--;stats();if(t<=0)end()},1000)};
  stats();return()=>{clearInterval(tm);clearTimeout(mt)};
}

/* ---------- Simon ---------- */
function simon(el,api){
  const C=['#ff5d73','#ffc857','#3ddc97','#4de1ff'],F=[330,415,495,660];let seq=[],i=0,lock=0,best=S.get('simon-best',0);
  el.innerHTML='<p class="msg" id="m" aria-live="polite">Mémorise la séquence.</p><div class="board simon" id="b"></div><div class="row"><button class="btn" id="re">Jouer</button></div>';
  const b=el.querySelector('#b'),m=el.querySelector('#m'),stats=()=>api.stats([['Niveau',seq.length],['Record',best]]);
  C.forEach((c,k)=>{const p=document.createElement('button');p.style.setProperty('--c',c);p.setAttribute('aria-label','Pad '+(k+1));p.onclick=()=>press(k);b.append(p)});
  const lit=k=>{const p=b.children[k];p.classList.add('on');beep(F[k],.25,'sine',.08);setTimeout(()=>p.classList.remove('on'),260)};
  function show(){lock=1;m.textContent='Regarde…';seq.forEach((k,n)=>setTimeout(()=>lit(k),600+n*480));setTimeout(()=>{lock=0;i=0;m.textContent='À toi !'},600+seq.length*480)}
  function press(k){if(lock||!seq.length)return;lit(k);
    if(k!=seq[i]){lock=1;if(seq.length-1>best){best=seq.length-1;S.set('simon-best',best)}m.textContent='Raté ! Tu as atteint le niveau '+(seq.length-1)+'.';beep(150,.4,'sawtooth');seq=[];stats();return}
    if(++i==seq.length){seq.push(Math.random()*4|0);stats();lock=1;setTimeout(show,700)}}
  el.querySelector('#re').onclick=()=>{seq=[Math.random()*4|0];stats();show()};stats();
  return()=>{seq=[];lock=1};
}

/* ---------- Pong ---------- */
function pong(el,api){
  const W=400,H=300,[x,c,re]=cvs(el,W,H,'Souris, doigt ou ↑ ↓. Premier à 7 points.'),[k,off]=keys();
  let py,ay,b,s1,s2,tm,best=S.get('pong-best',0);
  const stats=()=>api.stats([['Toi',s1],['Ordi',s2],['Victoires',best]]);
  const serve=d=>{b={x:200,y:150,vx:4*d,vy:(Math.random()-.5)*5}};
  function draw(m){x.fillStyle='#0b1030';x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.15)';for(let i=0;i<H;i+=20)x.fillRect(198,i,4,10);x.fillStyle='#eef0ff';x.fillRect(14,py,8,60);x.fillRect(W-22,ay,8,60);x.fillStyle='#ffc857';x.beginPath();x.arc(b.x,b.y,7,0,7);x.fill();ov(x,W,H,m)}
  function step(){if(k.ArrowUp||k.z)py-=6;if(k.ArrowDown||k.s)py+=6;py=Math.max(0,Math.min(H-60,py));
    ay+=Math.max(-3.4,Math.min(3.4,b.y-30-ay));ay=Math.max(0,Math.min(H-60,ay));
    b.x+=b.vx;b.y+=b.vy;if(b.y<7||b.y>H-7)b.vy*=-1;b.vy=Math.max(-7,Math.min(7,b.vy));
    if(b.vx<0&&b.x<29&&b.x>14&&b.y>py-6&&b.y<py+66){b.vx=Math.min(9,-b.vx*1.07);b.vy+=(b.y-py-30)*.12;beep(440,.05)}
    if(b.vx>0&&b.x>W-29&&b.x<W-14&&b.y>ay-6&&b.y<ay+66){b.vx=-Math.min(9,b.vx*1.07);b.vy+=(b.y-ay-30)*.12;beep(330,.05)}
    if(b.x<0||b.x>W){const left=b.x<0;left?s2++:s1++;beep(left?150:800,.2,left?'sawtooth':'triangle');
      if(s1==7||s2==7){clearInterval(tm);if(s1==7){best++;S.set('pong-best',best);confetti()}stats();draw(s1==7?'Gagné !':'Perdu');return}
      stats();serve(left?-1:1)}
    draw()}
  function reset(){clearInterval(tm);py=ay=120;s1=s2=0;serve(1);stats();draw('Appuie sur Jouer')}
  re.onclick=()=>{reset();tm=setInterval(step,16)};
  c.onpointermove=e=>{py=Math.max(0,Math.min(H-60,(e.clientY-c.getBoundingClientRect().top)/c.clientHeight*H-30))};
  reset();return()=>{clearInterval(tm);off()};
}
